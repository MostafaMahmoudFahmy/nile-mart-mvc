
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NileMart - Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 35px;
            background: #f5f6fa;
            color: #222;
        }

        nav {
            display: flex;
            gap: 20px;
            padding: 16px;
            background: #222;
            margin-bottom: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        h1 { margin-bottom: 20px; }

        .add-button {
            display: inline-block;
            background: #1769aa;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 13px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        tr:nth-child(even) {
            background: #f1f1f1;
        }
    </style>
</head>
<body>

<nav>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/categories}">Categories</a>
    <a th:href="@{/brands}">Brands</a>
</nav>

<h1>Products</h1>

<a class="add-button" th:href="@{/products/new}">
    Add New Product
</a>

<table>
    <thead>
    <tr>
        <th>SKU</th>
        <th>Name</th>
        <th>Category</th>
        <th>Brand</th>
        <th>Price (EGP)</th>
        <th>Stock</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.sku}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${categoryNames[product.sku]}"></td>
        <td th:text="${brandNames[product.sku]}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${product.inStock}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
