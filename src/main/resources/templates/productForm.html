
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NileMart - Add Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 35px;
            background: #f5f6fa;
        }

        nav {
            display: flex;
            gap: 20px;
            padding: 16px;
            background: #222;
            margin-bottom: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        form {
            background: white;
            padding: 25px;
            max-width: 550px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<nav>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/categories}">Categories</a>
    <a th:href="@{/brands}">Brands</a>
</nav>

<h1>Add Product</h1>

<form th:action="@{/products}"
      th:object="${product}"
      method="post">

    <label>SKU</label>
    <input type="text" th:field="*{sku}">
    <div class="error" th:errors="*{sku}"></div>

    <label>Name</label>
    <input type="text" th:field="*{name}">
    <div class="error" th:errors="*{name}"></div>

    <label>Category</label>
    <select th:field="*{category}">
        <option value="">Choose a category</option>
        <option th:each="category : ${categories}"
                th:value="${category.slug}"
                th:text="${category.name}">
        </option>
    </select>
    <div class="error" th:errors="*{category}"></div>

    <label>Brand</label>
    <select th:field="*{brandSlug}">
        <option value="">No brand</option>
        <option th:each="brand : ${brands}"
                th:value="${brand.slug}"
                th:text="${brand.name}">
        </option>
    </select>
    <div class="error" th:errors="*{brandSlug}"></div>

    <label>Price</label>
    <input type="number" step="0.01" th:field="*{price}">
    <div class="error" th:errors="*{price}"></div>

    <label>Stock</label>
    <input type="number" th:field="*{inStock}">
    <div class="error" th:errors="*{inStock}"></div>

    <button type="submit">Save Product</button>
</form>

</body>
</html>
