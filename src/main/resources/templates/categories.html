
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NileMart - Categories</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 35px;
            background: #f5f6fa;
        }

        nav {
            display: flex;
            gap: 20px;
            padding: 16px;
            background: #222;
            margin-bottom: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 13px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        .add-button {
            display: inline-block;
            background: #1769aa;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<nav>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/categories}">Categories</a>
    <a th:href="@{/brands}">Brands</a>
</nav>

<h1>Categories</h1>

<a class="add-button" th:href="@{/categories/new}">
    Add New Category
</a>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Parent</th>
        <th>Display Order</th>
        <th>Active</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="category : ${categories}">
        <td>
            <span th:if="${!#strings.isEmpty(category.parentSlug)}">— </span>
            <span th:text="${category.name}"></span>
        </td>

        <td th:text="${category.slug}"></td>

        <td th:text="${parentNames[category.slug]}"></td>
        <td th:text="${category.displayOrder}"></td>

        <td th:text="${category.active ? 'Yes' : 'No'}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
